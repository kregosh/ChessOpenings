<!doctype html>
<!-- Runs Stockfish.js in a Web Worker inside the app's hidden WebView. "Engine" is the
     app's JavaScript interface; the app sends UCI commands by calling send(). -->
<meta charset="utf-8">
<script>
  const worker = new Worker('stockfish.js');
  worker.onmessage = function (e) { Engine.onLine(String(e.data)); };
  worker.onerror = function (e) { Engine.onError(String(e.message || e)); };
  function send(command) { worker.postMessage(command); }
  Engine.onReady();
</script>
