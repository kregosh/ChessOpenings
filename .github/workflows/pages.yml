name: Pages

# Publishes the browser app to GitHub Pages on every push to main.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build the browser app
        run: ./gradlew --no-daemon -p web wasmJsBrowserDistribution

      # The app's script keeps its name from build to build, so browsers could go on
      # running a cached old version. Name it after the commit; index.html itself is only
      # cached for minutes.
      - name: Give the app script a fresh name
        working-directory: web/build/dist/wasmJs/productionExecutable
        run: |
          v="${GITHUB_SHA:0:12}"
          mv chessopenings.js "chessopenings.$v.js"
          sed -i "s#src=\"chessopenings\.js\"#src=\"chessopenings.$v.js\"#" index.html
          grep -q "chessopenings.$v.js" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
